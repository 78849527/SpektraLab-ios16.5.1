name: iOS 16 native port
on:
  push:
    branches:
      - port/ios16-native-engine
  pull_request:
    paths:
      - 'ios/**'
      - 'engine/**'
      - '.github/workflows/ios16.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iphoneos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout complete original repository
        uses: actions/checkout@v4
      - name: Toolchain and available SDKs
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --find metal
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build original C++ engine and exact Metal kernels for iOS 16
        run: bash ios/scripts/build-engine.sh
      - name: Generate iOS SwiftUI project
        run: cd ios && xcodegen generate --spec project.yml
      - name: Compile RELEASE physical-device app without debug dylib
        run: |
          xcodebuild -project ios/SpectraPort.xcodeproj -scheme SpectraPort \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build/DerivedData \
            ENABLE_DEBUG_DYLIB=NO CODE_SIGNING_ALLOWED=NO build
      - name: Verify deployment version and single-binary layout
        run: |
          APP="ios/build/DerivedData/Build/Products/Release-iphoneos/SpectraPort.app"
          test -f "$APP/SpectraPort"
          test ! -f "$APP/SpectraPort.debug.dylib"
          /usr/libexec/PlistBuddy -c "Print MinimumOSVersion" "$APP/Info.plist" | grep -qx "16.0"
          /usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP/Info.plist" | grep -qx "8"
          otool -L "$APP/SpectraPort"
      - name: Package unsigned RELEASE IPA for manual signing
        run: |
          mkdir -p ios/build/package/Payload
          cp -R ios/build/DerivedData/Build/Products/Release-iphoneos/SpectraPort.app ios/build/package/Payload/
          cd ios/build/package
          zip -q -r ../SpectraPort-ios16-v0.7.0-darkroom-ui-unsigned.ipa Payload
      - name: Upload device build
        uses: actions/upload-artifact@v4
        with:
          name: SpectraPort-ios16-v0.7.0-darkroom-ui-unsigned
          path: ios/build/SpectraPort-ios16-v0.7.0-darkroom-ui-unsigned.ipa
          if-no-files-found: error
      - name: Publish public IPA download (unofficial prerelease)
        if: github.event_name == 'push' && github.ref == 'refs/heads/port/ios16-native-engine'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="ios/build/SpectraPort-ios16-v0.7.0-darkroom-ui-unsigned.ipa"
          TAG="ios16-v0.7.0"
          test -s "$FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --target "$GITHUB_SHA" \
              --title "SpectraPort iOS 16 v0.7.0 (unofficial test)" \
              --notes "Unofficial iOS 16 test port based on SpektraLab. Adds a swipeable film card library, stock selection menus, collapsible grouped controls, and a bottom apply bar. Retains original Metal/C++ spectral rendering, presets and high-res export. The IPA is unsigned and requires manual signing. Not yet validated on all iPhone hardware." \
              --prerelease
          fi
          gh release view "$TAG" --json url -q .url
