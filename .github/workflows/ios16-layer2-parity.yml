          assert 'VStack(spacing: 0)' in local
          assert 'CURRENT_PROJECT_VERSION: "48"' in project
          assert "LocalMaskCanvas(" in editor
          print("FINE_SLIDER_HIDDEN_NAV_BUILD33_PASS")
          PY
      - name: Verify dense 38pt control spacing
        run: |
