name: iOS Desktop Layer2 Parity Gate
on:
  push:
    branches:
      - feature/ios16-desktop-layer2-parity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-macos-shared-models:
    # Use standard Intel macOS runner while arm64 macos-latest capacity is degraded.
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify copied models match Mac upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("modern_UI/Spektrafilm/Spektrafilm/Model")
          curve = Path("ios/SpectraPort/Engine/DesktopCurveMath.swift").read_text()
          adjust = Path("ios/SpectraPort/Engine/DesktopAdjustments.swift").read_text()
          assert curve.startswith("// Exact original CurveMath.swift from macOS; only the module-local\n// CGFloat.clamped(to:) helper is supplied below for independent compilation.\n" + (root / "CurveMath.swift").read_text())
          mask = Path("ios/SpectraPort/Engine/DesktopMasks.swift").read_text()
          assert adjust == "// Unmodified macOS Adjustments.swift. The shared Layer2Uniforms.tone()\n// implementation now comes from the unmodified desktop Mask.swift.\n" + (root / "Adjustments.swift").read_text()
          assert mask == "// Unmodified macOS Mask.swift (the source also owns shared tone arithmetic).\n" + (root / "Mask.swift").read_text()
          # Confirm the iOS physical print controls use the same CC scale and
          # product default intent as the actual macOS app, not a guessed value.
          mac_params = (root / "Params.swift").read_text()
          mac_session = (root / "Session.swift").read_text()
          ios_settings = Path("ios/SpectraPort/Engine/FilmCatalog.swift").read_text()
          ios_editor = Path("ios/SpectraPort/App/EditorView.swift").read_text()
          assert "static let filterShiftCC: Double = 40" in mac_params
          assert '"filter_shift_scale": 40.0' in ios_settings
          assert 'delta["product_defaults"] = .bool(true)' in mac_session
          assert '"product_defaults": true' in ios_settings
          assert "static func printExposure(stops: Double)" in mac_params
          assert "pow(2.0, -stops)" in mac_params
          assert "model.printExposure = pow(2, -stops)" in ios_editor
          # The Windows desktop has two Layer2 implementations: WebGL for
          # canvas and TS CPU for exports. Both must use the original
          # Metal sampler's normalized x*N-0.5 texel-centre formula.
          windows_gl = Path("desktop/src/canvas/glRenderer.ts").read_text()
          windows_cpu = Path("desktop/src/shared/adjustments.ts").read_text()
          mac_shader = Path("modern_UI/Spektrafilm/Spektrafilm/Canvas/Shaders.metal").read_text()
          assert "table.sample(s, float2(x, (float(row) + 0.5) / 5.0))" in mac_shader
          assert "float u = clamp(x, 0.0, 1.0);" in windows_gl
          assert "const f = clamp(sat(x) * n - 0.5, 0, n - 1)" in windows_cpu
          print("Mac original Metal, Windows WebGL and Windows CPU sampler contracts match")
          print("Mac curves, grading, masks and shared print defaults match upstream")
          PY
      - name: Compile desktop source-matched Swift models
        run: |
          swiftc -swift-version 5 -emit-executable \
            ios/SpectraPort/Engine/DesktopCurveMath.swift \
            ios/SpectraPort/Engine/DesktopAdjustments.swift \
            ios/SpectraPort/Engine/DesktopMasks.swift \
            ios/SpectraPort/Engine/FilmCatalog.swift \
            ios/tests/main.swift \
            -o /tmp/spectraport-layer2-model-tests
      - name: Run parity model tests
        run: /tmp/spectraport-layer2-model-tests
      - name: Test photo-space geometry, exact image fit and rotated mask handles
        run: |
          swiftc -swift-version 5 -emit-executable \
            ios/SpectraPort/Engine/MaskPhotoGeometry.swift \
            ios/tests/mask-preview/main.swift \
            -o /tmp/spectraport-mask-preview-geometry
          /tmp/spectraport-mask-preview-geometry | grep -q MASK_PHOTO_GEOMETRY_PASS
      - name: Verify fixed local mask canvas is independent from the loupe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          editor = Path("ios/SpectraPort/App/EditorView.swift").read_text()
          canvas = Path("ios/SpectraPort/App/LocalMaskCanvas.swift").read_text()
          overlay = Path("ios/SpectraPort/App/InlineMaskOverlay.swift").read_text()
          zoom = Path("ios/SpectraPort/App/InlineZoomPreview.swift").read_text()
          export = Path("ios/SpectraPort/Engine/SpectralRenderer.swift").read_text()
          # Local masking is a separate rendering branch, not an active
          # UIScrollView trying to reset to aspect-fit on every preview.
          assert "if editingMaskOnPhoto {\n                        // Local masks" in editor
          assert "LocalMaskCanvas(" in editor
          assert "} else {\n                        // Keep the existing loupe" in editor
          assert "maskEditing: false" in editor
          assert "if !editingMaskOnPhoto { fitWholePhoto() }" in editor
          assert "InlineMaskOverlay(" not in editor
          assert ".id(\"source-" in editor
          assert canvas.count("MaskPhotoGeometry.fittedRect(") == 1
          assert "Image(uiImage: image)" in canvas
          assert "photoRect: photoRect" in canvas
          assert "image: image" in canvas
          assert "chooseLuminance(" in overlay
          assert "MaskLuminanceSampling.sample(" in overlay
          assert "shape.kind == .luminanceRange" in overlay
          assert "在照片上点击取样亮度" in Path("ios/SpectraPort/App/MobileLocalMaskEditor.swift").read_text()
          assert "UIScrollView" not in canvas or "no UIScrollView" in canvas
          assert ".scaleEffect(" not in canvas
          assert "let photoRect: CGRect" in overlay
          assert "MaskPhotoGeometry.fittedRect(" not in overlay
          assert 'coordinateSpace: .named("mask-photo-overlay")' in overlay
          # Ordinary edit loupe still supports pinch, and original export
          # remains byte-for-byte untouched by this UI-only migration.
          assert "func scrollViewDidZoom" in zoom
          assert "geometry: nativeEdge ? .identity : geometry" in export
          print("FIXED_LOCAL_MASK_CANVAS_CONTRACT_PASS")
          PY
      - name: Verify on-photo luminance picker uses ROMM brightness
        run: |
          swiftc -swift-version 5 -emit-executable \
            ios/SpectraPort/Engine/MaskLuminanceSampling.swift \
            ios/tests/luminance-picker/main.swift \
            -o /tmp/luminance-picker-fixtures
          /tmp/luminance-picker-fixtures | grep -q LUMINANCE_PICKER_PASS
      - name: Verify compact controls and local tab grouping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          style = Path("ios/SpectraPort/App/DarkroomStyle.swift").read_text()
          local = Path("ios/SpectraPort/App/MobileLocalMaskEditor.swift").read_text()
          editor = Path("ios/SpectraPort/App/EditorView.swift").read_text()
          project = Path("ios/project.yml").read_text()
          assert "struct DarkroomControlRow: View" in style
          assert "CompactFineSlider(" in style
          assert "UIViewRepresentable" in style
          assert "Self.thumbImage(diameter: 10)" in style
          assert "Self.thumbImage(diameter: 12)" in style
          assert "height: CGFloat = 2" in style
          assert ".frame(height: 38)" in style
          assert "CompactSliderReadoutKey" in style
          assert ".frame(minHeight: 38)" in style
          assert 'TextField("数值", text: $precisionText)' in style
          assert "applyPreciseNumber()" in style
          assert "stepButton(" not in style
          assert 'case selection = "选区"' in local
          assert 'case light = "光线"' in local
          assert 'case color = "色彩"' in local
          assert 'kind == .luminanceRange' in local
          assert 'MaskColourRangePicker(' in local
          assert "if editingMaskOnPhoto {" in editor
          assert "LocalMaskCanvas(" in editor
          assert "showingQuickHelp" in editor
          assert 'CURRENT_PROJECT_VERSION: "48"' in project
          assert "geometry: nativeEdge ? .identity : geometry" in Path("ios/SpectraPort/Engine/SpectralRenderer.swift").read_text()
          print("COMPACT_UI_BUILD33_PASS")
          PY
      - name: Verify all nine navigation actions are in the single middle row
        run: |
          python3 - <<'PY'
          from pathlib import Path
          editor = Path("ios/SpectraPort/App/EditorView.swift").read_text()
          project = Path("ios/project.yml").read_text()
          start = editor.index("    private var editorSections: some View {")
          end = editor.index("    private var quickAdjustmentPanel", start)
          menu = editor[start:end]
          assert 'PhotosPicker(selection: $selectedPhoto, matching: .images)' in menu
          assert 'compactNavLabel("图库"' in menu
          assert 'compactNavLabel("拍摄"' in menu
          assert "openCamera()" in menu
          assert "ForEach([EditorTab.film, .adjust, .grade, .presets, .export]" in menu
          assert 'case export = "更多"' in editor
          assert "shareFullResolutionToApps()" in menu
          assert 'compactNavLabel("分享"' in menu
          assert ".disabled(!canExport)" in menu
          assert ".frame(maxWidth: .infinity, minHeight: 48)" in editor
          assert ".font(.system(size: 9," in editor
          assert 'ToolbarItemGroup(placement: .navigationBarLeading)' not in editor
          assert 'ToolbarItemGroup(placement: .navigationBarTrailing)' not in editor
          assert "bottomNavigation" not in editor
          assert ".safeAreaInset(edge: .bottom" not in editor
          assert 'Label("启动设置", systemImage: "gearshape")' in editor
          assert "LocalMaskCanvas(" in editor
          assert "MaskLuminanceSampling.sample(" in Path("ios/SpectraPort/App/InlineMaskOverlay.swift").read_text()
          assert 'CURRENT_PROJECT_VERSION: "48"' in project
          print("NINE_ACTION_COMPACT_NAV_BUILD33_PASS")
          PY
      - name: Verify hidden navigation chrome and fine slider touch contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          style = Path("ios/SpectraPort/App/DarkroomStyle.swift").read_text()
          editor = Path("ios/SpectraPort/App/EditorView.swift").read_text()
          local = Path("ios/SpectraPort/App/MobileLocalMaskEditor.swift").read_text()
          project = Path("ios/project.yml").read_text()
          assert ".toolbar(.hidden, for: .navigationBar)" in editor
          assert '.navigationTitle("SpectraPort")' not in editor
          assert "geometry.size.height * 0.50" in editor
          assert ".onPreferenceChange(CompactSliderReadoutKey.self)" in editor
          assert "activeSliderReadout" in editor
          assert 'private var editorSections: some View' in editor
          assert 'compactNavLabel("图库"' in editor
          assert 'compactNavLabel("分享"' in editor
          assert "bottomNavigation" not in editor
          assert "UISlider" in style and "UIViewRepresentable" in style
          assert 'diameter: 10' in style and 'diameter: 12' in style
          assert "height: CGFloat = 2" in style
          assert ".frame(height: 38)" in style
