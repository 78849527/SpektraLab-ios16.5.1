          balance = Path("ios/SpectraPort/App/MobileColorBalanceEditor.swift").read_text()
          assert style.count(".frame(minHeight: 38)") >= 2
          assert ".frame(height: 38)" in style
          assert "Self.thumbImage(diameter: 10)" in style
          assert "Self.thumbImage(diameter: 12)" in style
          assert "height: CGFloat = 2" in style
          assert "VStack(alignment: .leading, spacing: 3)" in editor
          assert "VStack(alignment: .leading, spacing: 3)" in local
          assert "VStack(alignment: .leading, spacing: 4)" in balance
          assert "LocalMaskCanvas(" in editor
          print("DENSE_ROWS_BUILD33_PASS")
          PY
      - name: Test non-destructive crop rotate straighten math
        run: |
          swiftc -swift-version 5 -emit-executable \
            ios/SpectraPort/Engine/PhotoGeometry.swift \
            ios/tests/photo-geometry/main.swift \
            -framework CoreGraphics -framework CoreImage \
            -o /tmp/spectraport-photo-geometry-tests
