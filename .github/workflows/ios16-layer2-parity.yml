name: iOS Desktop Layer2 Parity Gate
on:
  push:
    branches:
      - feature/ios16-desktop-layer2-parity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-macos-shared-models:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify copied models match Mac upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("modern_UI/Spektrafilm/Spektrafilm/Model")
          curve = Path("ios/SpectraPort/Engine/DesktopCurveMath.swift").read_text()
          adjust = Path("ios/SpectraPort/Engine/DesktopAdjustments.swift").read_text()
          assert curve.startswith("// Exact original CurveMath.swift from macOS; only the module-local\n// CGFloat.clamped(to:) helper is supplied below for independent compilation.\n" + (root / "CurveMath.swift").read_text())
          assert adjust.startswith("// Exact original Adjustments.swift from macOS, plus the shared\n// Layer2Uniforms.tone() body extracted unchanged from Model/Mask.swift.\n" + (root / "Adjustments.swift").read_text())
          mask = (root / "Mask.swift").read_text()
          assert adjust.endswith(mask[mask.index("extension Layer2Uniforms {") :].strip() + "\n")
          print("Mac model and shared tone implementation match exactly")
          PY
      - name: Compile desktop source-matched Swift models
        run: |
          swiftc -swift-version 5 -emit-executable \
            ios/SpectraPort/Engine/DesktopCurveMath.swift \
            ios/SpectraPort/Engine/DesktopAdjustments.swift \
            ios/tests/main.swift \
            -o /tmp/spectraport-layer2-model-tests
      - name: Run parity model tests
        run: /tmp/spectraport-layer2-model-tests
      - name: Compile unmodified Mac Layer2 Metal shader against iPhoneOS 16
        run: |
          xcrun --sdk iphoneos metal -miphoneos-version-min=16.0 \
            -fmetal-math-mode=safe -fmetal-math-fp32-functions=precise \
            -Werror -c modern_UI/Spektrafilm/Spektrafilm/Canvas/Shaders.metal \
            -o /tmp/spectraport-original-layer2-ios16.air
          test -s /tmp/spectraport-original-layer2-ios16.air
      - name: Link original Layer2 shader into an iOS Metal library
        run: |
          xcrun --sdk iphoneos metallib /tmp/spectraport-original-layer2-ios16.air \
            -o /tmp/spectraport-original-layer2.metallib
          test -s /tmp/spectraport-original-layer2.metallib
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build original spectral engine and bundled Mac Layer2 library
        run: bash ios/scripts/build-engine.sh
      - name: Generate iPhone icon and Xcode project
        run: |
          swift ios/scripts/generate-dog-icon.swift
          cd ios && xcodegen generate --spec project.yml
      - name: Compile iOS 16 device application on parity branch
        run: |
          xcodebuild -project ios/SpectraPort.xcodeproj -scheme SpectraPort \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build/DerivedData \
            ENABLE_DEBUG_DYLIB=NO CODE_SIGNING_ALLOWED=NO build
      - name: Verify the original desktop layer2 kernel is bundled
        run: |
          APP=ios/build/DerivedData/Build/Products/Release-iphoneos/SpectraPort.app
          test -s "$APP/engine/spectraport-desktop-layer2.metallib"
          test -f "$APP/SpectraPort"
