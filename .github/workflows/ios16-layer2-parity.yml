      - name: Verify preview and export share the same photo geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          editor = Path("ios/SpectraPort/App/EditorView.swift").read_text()
          renderer = Path("ios/SpectraPort/Engine/SpectralRenderer.swift").read_text()
          output = Path("ios/SpectraPort/Engine/FullSizeExporter.swift").read_text()
          helper = Path("ios/SpectraPort/Engine/PhotoGeometry.swift").read_text()
          canvas = Path("ios/SpectraPort/App/PhotoCropCanvas.swift").read_text()
          assert 'case geometry = "裁剪"' in editor
          assert "PhotoCropCanvas(" in editor
          assert "PhotoGeometryControls(" in editor
          assert "model.setPhotoGeometry($0)" in editor
          assert "unframedProcessed" in editor
          assert "cropEditingImage" in editor
          assert "PhotoGeometryPreview.render(" in editor
          assert "geometry: geometry, rawOptions: rawAtExport" in editor
          assert "geometry.apply(to: CIImage(cgImage: picture))" in output
          assert output.count("geometry.apply(to: CIImage(cgImage: picture))") == 2
          assert "geometry: nativeEdge ? .identity : geometry" in renderer
          assert "exportedWidth" in renderer and "exportedHeight" in renderer
          assert "func apply(to input: CIImage)" in helper
          assert "func oriented(_ original: CIImage)" in helper
          assert "private func cornerGesture(" in canvas
          assert "private func moveGesture(" in canvas
          assert "LocalMaskCanvas(" in editor
          assert 'CURRENT_PROJECT_VERSION: "48"' in Path("ios/project.yml").read_text()
          print("PHOTO_GEOMETRY_EXPORT_CONTRACT_PASS")
          PY
      - name: Verify bidirectional crop-aware local mask coordinates
